name: Update Stock
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  update-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download stock from Action-Wear API
        run: |
          ZIP_URL=$(curl -s \
            -H "Authorization: Bearer d2gckrl3fg107xe8y6xiqfi51h0qmn8y" \
            "https://api.action-wear.com/rest/it/V1/stockall" \
            | python3 -c "import sys,json; print(json.load(sys.stdin))")
          echo "ZIP URL: $ZIP_URL"
          curl -L -f -s "$ZIP_URL" -o export_stockall.zip
          unzip -o export_stockall.zip
          ls -la

      - name: Build stock_map.json
        run: |
          python3 << 'EOF'
          import json, glob

          json_files = [f for f in glob.glob('*.json') if f != 'stock_map.json']
          print("File JSON trovati:", json_files)
          if not json_files:
              raise FileNotFoundError("Nessun file JSON trovato dopo unzip")

          with open(json_files[0]) as f:
              raw = json.load(f)

          print("Tipo root:", type(raw).__name__)
          first_key = list(raw.keys())[0] if isinstance(raw, dict) else None
          if first_key:
              print("Esempio:", first_key, "->", raw[first_key])

          stock_map = {}

          # Formato attuale: {SKU: quantita_numerica}
          if isinstance(raw, dict):
              for sku, val in raw.items():
                  if isinstance(val, (int, float)):
                      avail = int(val)
                      stock_map[sku.upper()] = [avail, 0]
                  elif isinstance(val, dict):
                      avail = int(val.get('available', 0) or 0)
                      in_arrivo = int(val.get('supplier_1', 0) or 0) + int(val.get('supplier_2', 0) or 0)
                      stock_map[sku.upper()] = [avail, in_arrivo]
          elif isinstance(raw, list):
              for item in raw:
                  sku = item.get('sku') or item.get('SKU') or item.get('camac') or ''
                  if not sku: continue
                  avail = int(item.get('available', 0) or 0)
                  in_arrivo = int(item.get('supplier_1', 0) or 0) + int(item.get('supplier_2', 0) or 0)
                  stock_map[sku.upper()] = [avail, in_arrivo]

          if not stock_map:
              raise ValueError("stock_map vuoto")

          with open('stock_map.json', 'w') as f:
              json.dump(stock_map, f, separators=(',', ':'))
          print(f"Stock map aggiornata: {len(stock_map)} SKU")
          EOF

      - name: Commit and push stock_map.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_map.json
          git diff --cached --quiet || git commit -m "Auto-update stock_map.json $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

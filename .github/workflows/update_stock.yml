name: Update Stock
on:
  schedule:
    - cron: '0 5 * * *'  # ogni giorno alle 05:00 UTC (07:00 ora italiana)
  workflow_dispatch:      # permette di lanciarlo manualmente
jobs:
  update-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download stock from Action-Wear API
        run: |
          curl -s \
            -H "Authorization: Bearer d2gckrl3fg107xe8y6xiqfi51h0qmn8y" \
            "https://api.action-wear.com/rest/it/V1/stockall" \
            -o export_stockall.json

      - name: Debug struttura API
        run: |
          python3 << 'EOF'
          import json
          with open('export_stockall.json') as f:
              raw = json.load(f)
          print("Tipo root:", type(raw).__name__)
          if isinstance(raw, dict):
              print("Chiavi root:", list(raw.keys())[:10])
              for k, v in list(raw.items())[:2]:
                  print(f"  [{k}] tipo={type(v).__name__}, valore={str(v)[:200]}")
          elif isinstance(raw, list):
              print("Lista, lunghezza:", len(raw))
              print("Primo elemento:", str(raw[0])[:300] if raw else "vuota")
          EOF

      - name: Build stock_map.json
        run: |
          python3 << 'EOF'
          import json
          with open('export_stockall.json') as f:
              raw = json.load(f)

          stock_map = {}

          # Caso 1: root è dict con chiave 'tabular' -> dict di SKU
          if isinstance(raw, dict) and 'tabular' in raw and isinstance(raw['tabular'], dict):
              for sku, data in raw['tabular'].items():
                  if not isinstance(data, dict):
                      continue
                  avail = int(data.get('available', 0) or 0)
                  in_arrivo = int(data.get('supplier_1', 0) or 0) + int(data.get('supplier_2', 0) or 0)
                  stock_map[sku.upper()] = [avail, in_arrivo]

          # Caso 2: root è dict con chiave 'tabular' -> lista di oggetti
          elif isinstance(raw, dict) and 'tabular' in raw and isinstance(raw['tabular'], list):
              for item in raw['tabular']:
                  if not isinstance(item, dict):
                      continue
                  sku = item.get('sku') or item.get('SKU') or item.get('camac') or ''
                  if not sku:
                      continue
                  avail = int(item.get('available', 0) or 0)
                  in_arrivo = int(item.get('supplier_1', 0) or 0) + int(item.get('supplier_2', 0) or 0)
                  stock_map[sku.upper()] = [avail, in_arrivo]

          # Caso 3: root è direttamente una lista
          elif isinstance(raw, list):
              for item in raw:
                  if not isinstance(item, dict):
                      continue
                  sku = item.get('sku') or item.get('SKU') or item.get('camac') or ''
                  if not sku:
                      continue
                  avail = int(item.get('available', 0) or 0)
                  in_arrivo = int(item.get('supplier_1', 0) or 0) + int(item.get('supplier_2', 0) or 0)
                  stock_map[sku.upper()] = [avail, in_arrivo]

          # Caso 4: root è dict di SKU direttamente (senza 'tabular')
          elif isinstance(raw, dict):
              for sku, data in raw.items():
                  if not isinstance(data, dict):
                      continue
                  avail = int(data.get('available', 0) or 0)
                  in_arrivo = int(data.get('supplier_1', 0) or 0) + int(data.get('supplier_2', 0) or 0)
                  stock_map[sku.upper()] = [avail, in_arrivo]

          if not stock_map:
              raise ValueError("stock_map vuoto — struttura API non riconosciuta, controlla il debug sopra")

          with open('stock_map.json', 'w') as f:
              json.dump(stock_map, f, separators=(',', ':'))
          print(f"Stock map aggiornata: {len(stock_map)} SKU")
          EOF

      - name: Commit and push stock_map.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_map.json
          git diff --cached --quiet || git commit -m "Auto-update stock_map.json $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

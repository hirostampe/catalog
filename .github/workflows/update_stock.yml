name: Update Stock
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  update-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download stock from Action-Wear API
        run: |
          # Step 1: chiedi l'URL del file ZIP
          ZIP_URL=$(curl -s \
            -H "Authorization: Bearer d2gckrl3fg107xe8y6xiqfi51h0qmn8y" \
            "https://api.action-wear.com/rest/it/V1/stockall" | tr -d '"')
          echo "ZIP URL: $ZIP_URL"

          # Step 2: scarica lo ZIP
          curl -s "$ZIP_URL" -o export_stockall.zip

          # Step 3: decomprimi
          unzip -o export_stockall.zip
          ls -la *.json

      - name: Build stock_map.json
        run: |
          python3 << 'EOF'
          import json, os, glob

          # Trova il file JSON estratto dallo zip
          json_files = glob.glob('*.json')
          # Escludi stock_map.json se esiste già
          json_files = [f for f in json_files if f != 'stock_map.json']
          print("File JSON trovati:", json_files)

          if not json_files:
              raise FileNotFoundError("Nessun file JSON trovato dopo unzip")

          with open(json_files[0]) as f:
              raw = json.load(f)

          print("Tipo root:", type(raw).__name__)
          if isinstance(raw, dict):
              print("Chiavi root:", list(raw.keys())[:10])

          stock_map = {}

          # Caso 1: {sku: {available, supplier_1, supplier_2}}
          if isinstance(raw, dict) and all(isinstance(v, dict) for v in list(raw.values())[:3]):
              for sku, data in raw.items():
                  if not isinstance(data, dict): continue
                  avail = int(data.get('available', 0) or 0)
                  in_arrivo = int(data.get('supplier_1', 0) or 0) + int(data.get('supplier_2', 0) or 0)
                  stock_map[sku.upper()] = [avail, in_arrivo]

          # Caso 2: {'tabular': {sku: {...}}}
          elif isinstance(raw, dict) and 'tabular' in raw and isinstance(raw['tabular'], dict):
              for sku, data in raw['tabular'].items():
                  if not isinstance(data, dict): continue
                  avail = int(data.get('available', 0) or 0)
                  in_arrivo = int(data.get('supplier_1', 0) or 0) + int(data.get('supplier_2', 0) or 0)
                  stock_map[sku.upper()] = [avail, in_arrivo]

          # Caso 3: lista di oggetti
          elif isinstance(raw, list):
              for item in raw:
                  if not isinstance(item, dict): continue
                  sku = item.get('sku') or item.get('SKU') or item.get('camac') or ''
                  if not sku: continue
                  avail = int(item.get('available', 0) or 0)
                  in_arrivo = int(item.get('supplier_1', 0) or 0) + int(item.get('supplier_2', 0) or 0)
                  stock_map[sku.upper()] = [avail, in_arrivo]

          if not stock_map:
              # Stampa struttura per debug
              if isinstance(raw, dict):
                  first_key = list(raw.keys())[0]
                  print(f"Esempio chiave: {first_key}, valore: {raw[first_key]}")
              raise ValueError("stock_map vuoto — struttura non riconosciuta")

          with open('stock_map.json', 'w') as f:
              json.dump(stock_map, f, separators=(',', ':'))
          print(f"Stock map aggiornata: {len(stock_map)} SKU")
          EOF

      - name: Commit and push stock_map.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_map.json
          git diff --cached --quiet || git commit -m "Auto-update stock_map.json $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

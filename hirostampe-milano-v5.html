<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hirostampe Milano — Ordini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;
  --surface:#ffffff;
  --border:#e2e0da;
  --text:#1a1a18;
  --muted:#888884;
  --accent:#e8533a;
  --accent-dark:#c43f27;
  --success:#2d7a4f;
  --radius:10px;
  --font:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.logo{font-size:16px;font-weight:600;letter-spacing:-0.3px}
.logo span{color:var(--accent)}
.cart-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500;transition:background 0.15s}
.cart-btn:hover{background:var(--accent-dark)}
.cart-count{background:#fff;color:var(--accent);border-radius:20px;padding:1px 7px;font-size:12px;font-weight:600}
.layout{display:grid;grid-template-columns:1fr 360px;gap:0;height:calc(100vh - 56px)}
.catalog-panel{overflow-y:auto;padding:20px 24px;border-right:1px solid var(--border)}
.order-panel{overflow-y:auto;background:var(--surface);padding:20px}
.panel-title{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--text)}
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-wrap{position:relative;flex:1}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-family:var(--font);font-size:13px;color:var(--text);outline:none}
.search-wrap input:focus{border-color:#aaa}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;background:var(--surface);color:var(--muted);transition:all 0.12s;white-space:nowrap}
.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform 0.12s,box-shadow 0.12s}
.prod-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.prod-card img{width:100%;height:120px;object-fit:cover;background:#f0efeb;display:block}
.prod-card-body{padding:10px}
.prod-brand{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.prod-name{font-size:12px;font-weight:500;line-height:1.3;margin-bottom:4px}
.prod-sku{font-size:10px;color:var(--muted);font-family:var(--mono)}
.prod-vars{font-size:10px;color:var(--muted);margin-top:4px}
/* Drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:none;align-items:flex-end}
.drawer-overlay.open{display:flex}
.drawer{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:20px}
.drawer-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px}
.drawer-title{font-size:15px;font-weight:600;margin-bottom:4px}
.drawer-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.drawer-img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius);margin-bottom:16px;background:#f0efeb}
.section-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.swatch-img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:2px solid transparent;background:#f0efeb}
.swatch.sel .swatch-img{border-color:var(--accent)}
.swatch-name{font-size:10px;color:var(--muted);text-align:center;max-width:50px;line-height:1.2}
.size-grid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.size-btn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;background:var(--surface);color:var(--text);transition:all 0.12s}
.size-btn.sel{background:var(--text);color:#fff;border-color:var(--text)}
.size-btn:disabled{opacity:0.3;cursor:not-allowed}
.size-btn-out{opacity:0.45;text-decoration:line-through}
.qty-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qty-ctrl{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.qty-ctrl button{width:36px;height:36px;border:none;background:transparent;cursor:pointer;font-size:16px;color:var(--text)}
.qty-ctrl button:hover{background:var(--bg)}
.qty-ctrl span{min-width:32px;text-align:center;font-size:14px;font-weight:500}
.price-display{font-size:20px;font-weight:600;color:var(--accent)}
.price-note{font-size:11px;color:var(--muted);margin-left:4px}
.btn-add{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s}
.btn-add:hover{background:var(--accent-dark)}
.btn-add:disabled{background:#ccc;cursor:not-allowed}
/* Order panel */
.order-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.order-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.order-item:last-child{border-bottom:none}
.order-item img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#f0efeb;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-size:13px;font-weight:500;line-height:1.3}
.item-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.item-price{font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.item-actions{display:flex;align-items:center;gap:6px;margin-top:6px}
.item-qty{display:flex;align-items:center;gap:4px}
.item-qty button{width:22px;height:22px;border:1px solid var(--border);border-radius:5px;background:transparent;cursor:pointer;font-size:13px;color:var(--text)}
.item-qty span{min-width:20px;text-align:center;font-size:12px}
.item-del{margin-left:auto;width:24px;height:24px;border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:16px}
.order-total{padding:14px 0 0;border-top:1px solid var(--border);margin-top:8px}
.total-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--muted)}
.total-final{display:flex;justify-content:space-between;font-size:16px;font-weight:600;color:var(--text)}
.note-area{margin-top:14px}
.note-area label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.note-area textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;resize:none;height:70px;outline:none;color:var(--text);background:var(--surface)}
.note-area textarea:focus{border-color:#aaa}
.btn-send{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;margin-top:14px;transition:background 0.15s}
.btn-send:hover{background:var(--accent-dark)}
.btn-send:disabled{background:#ccc;cursor:not-allowed}
.success-screen{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px}
.success-icon{font-size:48px;margin-bottom:16px}
.success-title{font-size:20px;font-weight:600;margin-bottom:8px}
.success-sub{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.btn-new{padding:10px 24px;background:var(--text);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer}
.stk{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:4px}
.stk-ok{background:#e6f4ec;color:#2d7a4f}
.stk-low{background:#fff8e1;color:#b08000}
.stk-arr{background:#e8f0fe;color:#1a56db}
.stk-no{background:#fce8e6;color:#c5221f}
/* Loading */
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:999;opacity:0;transition:opacity 0.2s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:700px){
  .layout{grid-template-columns:1fr;height:auto}
  .order-panel{display:none}
  .catalog-panel{border-right:none}
}
</style>
</head>
<body>

<header>
  <div class="logo">Hiro<span>stampe</span> <span style="font-size:12px;color:var(--muted);font-weight:400">Milano</span></div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Carrello <span class="cart-count" id="cart-count">0</span>
  </button>
</header>

<div class="layout">
  <!-- CATALOGO -->
  <div class="catalog-panel">
    <div class="panel-title">Catalogo prodotti</div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Cerca per nome, SKU, brand..." oninput="renderCatalog()">
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div id="catalog-grid" class="prod-grid">
      <div class="loading"><div class="spinner"></div>Caricamento catalogo...</div>
    </div>
  </div>

  <!-- ORDINE -->
  <div class="order-panel" id="order-panel">
    <div id="order-main">
      <div class="panel-title">Il tuo ordine</div>
      <div id="order-items"><div class="order-empty">Aggiungi prodotti dal catalogo</div></div>
      <div id="order-footer" style="display:none">
        <div class="order-total">
          <div class="total-row"><span>Subtotale</span><span id="subtotal">€0.00</span></div>
          <div class="total-final"><span>Totale</span><span id="total">€0.00</span></div>
        </div>
        <div class="note-area">
          <label>Note ordine (tipo stampa, colore logo, riferimenti...)</label>
          <textarea id="order-note" placeholder="Es: stampa serigrafica fronte, logo bianco..."></textarea>
        </div>
        <button class="btn-send" onclick="inviaOrdine()">📤 Invia ordine a Hirostampe</button>
      </div>
    </div>
    <div class="success-screen" id="success-screen">
      <div class="success-icon">✅</div>
      <div class="success-title">Ordine inviato!</div>
      <div class="success-sub">Hirostampe ha ricevuto il tuo ordine.<br>Riceverai conferma a breve.</div>
      <button class="btn-new" onclick="nuovoOrdine()">Nuovo ordine</button>
    </div>
  </div>
</div>

<!-- DRAWER PRODOTTO -->
<div class="drawer-overlay" id="drawer" onclick="closeDrawer(event)">
  <div class="drawer" id="drawer-content">
    <div class="drawer-handle"></div>
    <img id="d-img" class="drawer-img" src="" alt="">
    <div class="drawer-title" id="d-name"></div>
    <div class="drawer-sub" id="d-sub"></div>
    <div class="section-label">Colore</div>
    <div class="color-swatches" id="d-colors"></div>
    <div class="section-label">Taglia</div>
    <div class="size-grid" id="d-sizes"></div>
    <div class="qty-row">
      <div class="section-label" style="margin:0">Quantità</div>
      <div class="qty-ctrl">
        <button onclick="chgQty(-1)">−</button>
        <span id="d-qty">1</span>
        <button onclick="chgQty(1)">+</button>
      </div>
      <div>
        <span class="price-display" id="d-price">—</span>
        <span class="price-note">cad. (IVA escl.)</span>
      </div>
    </div>
    <div id="d-stock-badge" style="margin-bottom:10px"></div>
<button class="btn-add" id="btn-add" onclick="addToCart()">Aggiungi al carrello</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────
const MARKUP = 1.15; // +15%
const EMAILJS_SERVICE = 'YOUR_SERVICE_ID';
const EMAILJS_TEMPLATE = 'YOUR_TEMPLATE_ID';
const EMAILJS_KEY = 'YOUR_PUBLIC_KEY';
const TO_EMAIL = 'hirostampe@gmail.com';

// ─── STATE ────────────────────────────────
let catalog = [];
let cart = [];
let activeFilter = '';
let currentProd = null;
let selectedColor = null;
let selectedSize = null;
let qty = 1;
let prices = {}; // legacy
let pricesMap = {}; // camac+color -> prezzo base
let stockMap = {}; // SKU_UPPER -> [available, in_arrivo]

// ─── INIT ─────────────────────────────────
async function init() {
  await loadCatalog();
  loadPrices();
  loadStock();
}

async function loadStock() {
  try {
    const r = await fetch('https://hirostampe.github.io/catalog/stock_map.json');
    if(r.ok) {
      stockMap = await r.json();
      renderCatalog();
    }
  } catch(e) { console.error('stock load error', e); }
}

function getStock(sku) {
  if(!sku) return null;
  return stockMap[sku.toUpperCase()] || null;
}

function stockBadge(available, in_arrivo) {
  if(available > 50) return '<span class="stk stk-ok">✓ Disponibile</span>';
  if(available > 0) return \`<span class="stk stk-low">⚠ Ultime \${available} pz</span>\`;
  if(in_arrivo > 0) return \`<span class="stk stk-arr">↓ In arrivo \${in_arrivo} pz</span>\`;
  return '<span class="stk stk-no">✗ Esaurito</span>';
}

async function loadCatalog() {
  try {
    const r = await fetch('https://hirostampe.github.io/catalog/catalog.json');
    if(r.ok) {
      catalog = await r.json();
      buildFilters();
      renderCatalog();
      return;
    }
  } catch(e) {}
  // Fallback: usa INLINE_CATALOG
  catalog = INLINE_CATALOG;
  buildFilters();
  renderCatalog();
}

function buildCatalog(hierarchical) {
  catalog = [];
  for(const [sku, p] of Object.entries(hierarchical)) {
    const variants = [];
    const colorImgs = {};
    for(const [vsku, v] of Object.entries(p.simple_products||{})) {
      const col = v.nome_colore||'';
      const tag = v.camac_size||'';
      variants.push({s:vsku,c:col,t:tag});
      if(col && !colorImgs[col]) {
        const imgs = v.immagini_colore||[];
        colorImgs[col] = imgs[0]||'';
      }
    }
    const img = p.immagini_base||[];
    catalog.push({k:sku,n:p.name||'',b:p.brand||'',cat:p.camac_categorydetail||'',i:img[0]||'',ci:colorImgs,v:variants});
  }
  buildFilters();
  renderCatalog();
}

async function loadPrices() {
  try {
    // Decompress inline prices (gzip+base64)
    const binary = atob(PRICES_B64);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    const reader = ds.readable.getReader();
    writer.write(bytes);
    writer.close();
    let json = '';
    while(true) {
      const {done, value} = await reader.read();
      if(done) break;
      json += new TextDecoder().decode(value);
    }
    // prices map: "SKU_CAMAC-COLORCODE" -> price
    pricesMap = JSON.parse(json);
    renderCatalog(); // re-render with prices
  } catch(e) { console.error('prices load error', e); }
}

function getPrice(skuOrCamac, colorCode) {
  // Try camac+color key first: "SKUCAMAC-COLORCODE"
  if(colorCode) {
    const key = (skuOrCamac+'-'+colorCode).toUpperCase();
    if(pricesMap[key]) return pricesMap[key] * MARKUP;
  }
  // Try just the camac sku (any color)
  const upper = skuOrCamac.toUpperCase();
  // Search for any entry starting with this sku
  for(const k of Object.keys(pricesMap)) {
    if(k.startsWith(upper+'-')) return pricesMap[k] * MARKUP;
  }
  // Fallback: old prices object
  const base = prices[skuOrCamac] || prices[skuOrCamac.toUpperCase()] || 0;
  return base * MARKUP;
}

// ─── CATALOG ──────────────────────────────
let catFilter = '';
function buildFilters() {
  const cats = [...new Set(catalog.map(p=>p.cat).filter(Boolean))].sort();
  const el = document.getElementById('filters');
  el.innerHTML = '<button class="chip active" onclick="setFilter(\'\',this)">Tutti</button>' +
    cats.map(c=>`<button class="chip" onclick="setFilter('${c}',this)">${c}</button>`).join('');
}

function setFilter(c, btn) {
  catFilter = c;
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCatalog();
}

function renderCatalog() {
  const q = (document.getElementById('search').value||'').toLowerCase();
  let list = catalog;
  if(catFilter) list = list.filter(p=>p.cat===catFilter);
  if(q) list = list.filter(p=>(p.n+p.k+p.b).toLowerCase().includes(q));
  const el = document.getElementById('catalog-grid');
  if(!list.length){el.innerHTML='<div class="loading">Nessun prodotto trovato</div>';return;}
  el.innerHTML = list.slice(0,200).map(p=>{
    const nColors = Object.keys(p.ci||{}).length||[...new Set(p.v.map(v=>v.c))].length;
    const nSizes = [...new Set(p.v.map(v=>v.t))].length;
    const price = getPrice(p.k);
    return `<div class="prod-card" onclick="openDrawer('${p.k}')">
      <img src="${p.i}" alt="${p.n}" loading="lazy" onerror="this.src=''">
      <div class="prod-card-body">
        <div class="prod-brand">${p.b}</div>
        <div class="prod-name">${p.n}</div>
        <div class="prod-sku">${p.k}</div>
        <div class="prod-vars">${nColors} colori · ${nSizes} taglie</div>
        ${price>0?`<div style="font-size:12px;font-weight:600;color:var(--accent);margin-top:4px">da €${price.toFixed(2)}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ─── DRAWER ───────────────────────────────
function openDrawer(sku) {
  currentProd = catalog.find(p=>p.k===sku);
  if(!currentProd) return;
  selectedColor = null; selectedSize = null; qty = 1;
  document.getElementById('d-name').textContent = currentProd.n;
  document.getElementById('d-sub').textContent = currentProd.b + ' · ' + currentProd.k;
  document.getElementById('d-img').src = currentProd.i;
  document.getElementById('d-qty').textContent = '1';
  document.getElementById('d-price').textContent = '—';
  document.getElementById('btn-add').disabled = true;
  renderDrawerColors();
  renderDrawerSizes();
  document.getElementById('drawer').classList.add('open');
}

function renderDrawerColors() {
  const colors = [...new Set(currentProd.v.map(v=>v.c).filter(Boolean))];
  const ci = currentProd.ci || {};
  document.getElementById('d-colors').innerHTML = colors.map(c=>{
    const img = ci[c] || currentProd.i;
    return `<div class="swatch" onclick="selectColor('${c}')" data-color="${c}">
      <img class="swatch-img" src="${img}" alt="${c}" onerror="this.src='${currentProd.i}'">
      <span class="swatch-name">${c}</span>
    </div>`;
  }).join('');
}

function renderDrawerSizes() {
  const sizes = [...new Set(currentProd.v.map(v=>v.t).filter(Boolean))];
  document.getElementById('d-sizes').innerHTML = sizes.map(t=>{
    // Try to get stock for selected color + this size
    let stockInfo = '';
    if(selectedColor) {
      const v = currentProd.v.find(x=>x.c===selectedColor && x.t===t);
      if(v) {
        const s = getStock(v.s);
        if(s) {
          const avail = s[0];
          const arr = s[1];
          const dot = avail > 50 ? '🟢' : avail > 0 ? '🟡' : arr > 0 ? '🔵' : '🔴';
          stockInfo = ` <span style="font-size:9px">${dot} ${avail>0?avail:arr>0?'↓'+arr:'esaurito'}</span>`;
        }
      }
    }
    const v = currentProd.v.find(x=>x.c===selectedColor && x.t===t);
    const s = v ? getStock(v.s) : null;
    const unavail = s && s[0]===0 && s[1]===0;
    return `<button class="size-btn${unavail?' size-btn-out':''}" onclick="selectSize('${t}')" data-size="${t}">${t}${stockInfo}</button>`;
  }).join('');
}

function selectColor(c) {
  selectedColor = c;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('sel', s.dataset.color===c));
  // Update image
  const img = (currentProd.ci||{})[c] || currentProd.i;
  document.getElementById('d-img').src = img;
  updatePrice();
}

function selectSize(t) {
  selectedSize = t;
  document.querySelectorAll('.size-btn').forEach(b=>b.classList.toggle('sel', b.dataset.size===t));
  updatePrice();
}

function updatePrice() {
  const canAdd = selectedColor && selectedSize;
  document.getElementById('btn-add').disabled = !canAdd;
  if(!canAdd){document.getElementById('d-price').textContent='—';
    const sb = document.getElementById('d-stock-badge');
    if(sb) sb.innerHTML='';
    return;
  }
  const varSku = getVarSku();
  const colorCode = selectedColor ? getColorCode(selectedColor) : null;
  const p = getPrice(currentProd.k, colorCode);
  document.getElementById('d-price').textContent = p>0 ? '€'+p.toFixed(2) : '—';
  // Stock badge
  const sb = document.getElementById('d-stock-badge');
  if(sb && varSku) {
    const s = getStock(varSku);
    sb.innerHTML = s ? stockBadge(s[0], s[1]) : '';
  }
  // Disable add button if out of stock
  if(canAdd) {
    const s = varSku ? getStock(varSku) : null;
    if(s && s[0]===0 && s[1]===0) {
      document.getElementById('btn-add').disabled = true;
    }
  }
}

function getVarSku() {
  const v = currentProd.v.find(x=>x.c===selectedColor && x.t===selectedSize);
  return v ? v.s : null;
}

function chgQty(d) {
  qty = Math.max(1, qty+d);
  document.getElementById('d-qty').textContent = qty;
}

function addToCart() {
  if(!selectedColor || !selectedSize) return;
  const varSku = getVarSku() || currentProd.k+'-'+selectedColor+'-'+selectedSize;
  const price = getPrice(getVarSku() || currentProd.k);
  const existing = cart.find(i=>i.sku===varSku);
  if(existing) { existing.qty += qty; }
  else {
    cart.push({
      sku: varSku,
      prodSku: currentProd.k,
      nome: currentProd.n,
      brand: currentProd.b,
      colore: selectedColor,
      taglia: selectedSize,
      qty,
      prezzo: price,
      img: (currentProd.ci||{})[selectedColor] || currentProd.i
    });
  }
  closeDrawer();
  renderCart();
  showToast('Aggiunto al carrello ✓');
}

function closeDrawer(e) {
  if(e && e.target !== document.getElementById('drawer')) return;
  document.getElementById('drawer').classList.remove('open');
}

// ─── CART ────────────────────────────────
function toggleCart() {
  document.getElementById('order-panel').scrollIntoView({behavior:'smooth'});
}

function renderCart() {
  const el = document.getElementById('order-items');
  const footer = document.getElementById('order-footer');
  document.getElementById('cart-count').textContent = cart.reduce((s,i)=>s+i.qty,0);
  if(!cart.length){
    el.innerHTML='<div class="order-empty">Aggiungi prodotti dal catalogo</div>';
    footer.style.display='none';
    return;
  }
  el.innerHTML = cart.map((item,i)=>`
    <div class="order-item">
      <img src="${item.img}" alt="" onerror="this.src=''">
      <div class="item-info">
        <div class="item-name">${item.nome}</div>
        <div class="item-sub">${item.sku}</div>
        <div class="item-sub">${item.colore} — ${item.taglia}</div>
        <div class="item-actions">
          <div class="item-qty">
            <button onclick="chgCartQty(${i},-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="chgCartQty(${i},1)">+</button>
          </div>
          <div class="item-price" style="margin-left:8px;font-size:13px;font-weight:600;color:var(--accent)">${item.prezzo>0?'€'+(item.prezzo*item.qty).toFixed(2):'—'}</div>
          <button class="item-del" onclick="removeFromCart(${i})">✕</button>
        </div>
      </div>
    </div>`).join('');
  const sub = cart.reduce((s,i)=>s+(i.prezzo*i.qty),0);
  document.getElementById('subtotal').textContent = '€'+sub.toFixed(2);
  document.getElementById('total').textContent = '€'+sub.toFixed(2);
  footer.style.display='block';
}

function chgCartQty(i, d) {
  cart[i].qty = Math.max(1, cart[i].qty+d);
  renderCart();
}

function removeFromCart(i) {
  cart.splice(i,1);
  renderCart();
}

// ─── COLOR NAME -> CODE MAP ───────────────
const COLOR_NAME_TO_CODE = {"blue":"bl","neon green":"ng","orange":"or","yellow":"yw","neon pink":"np","silver":"sil","green":"gr","light blue":"049","white":"wt","grey":"gy","dark grey":"005","khaki":"kha","black":"bk","navy":"nav","olive":"006","red":"re","pink":"pink","stone":"014","burgundy":"bur","columbia blue":"cb","brown":"br","beige":"be","mustard":"mus","royal":"035","forest green":"fg","white-royal blue":"aw","white-black":"th","white-kelly green":"wk","white-red":"wm","sky blue":"sk","sand":"sa","purple":"pu","lime":"li","cardinal":"ca","turquoise":"tu","mint":"mt"};

function getColorCode(colorName) {
  if(!colorName) return '';
  const lower = colorName.toLowerCase();
  if(COLOR_NAME_TO_CODE[lower]) return COLOR_NAME_TO_CODE[lower];
  // Try to extract from variant SKU directly
  return lower.replace(/[^a-z0-9]/g,'').substring(0,4);
}

// ─── INVIO ORDINE ────────────────────────
function buildCSV() {
  // Format: sku_prodotto,codice_colore,taglia,quantità (Action-Wear standard)
  const rows = [];
  cart.forEach(i=>{
    const prodSku = (i.prodSku || i.sku.split('-')[0]).toLowerCase();
    const colorCode = getColorCode(i.colore);
    const taglia = (i.taglia || '').toLowerCase();
    rows.push(`${prodSku},${colorCode},${taglia},${i.qty}`);
  });
  return rows.join('\n');
}

function buildCSVDetailed() {
  // Human-readable version for email body
  const rows = [['SKU','Prodotto','Colore','Taglia','Qtà','Prezzo unit.','Totale']];
  cart.forEach(i=>{
    rows.push([i.sku, i.nome, i.colore, i.taglia, i.qty, i.prezzo>0?'€'+i.prezzo.toFixed(2):'—', i.prezzo>0?'€'+(i.prezzo*i.qty).toFixed(2):'—']);
  });
  return rows.map(r=>r.join('\t')).join('\n');
}

async function inviaOrdine() {
  if(!cart.length){showToast('Carrello vuoto');return;}
  const btn = document.querySelector('.btn-send');
  btn.disabled=true; btn.textContent='Invio in corso...';
  
  const csvActionWear = buildCSV();     // formato Action-Wear: sku,colore,taglia,qty
  const csvDetailed = buildCSVDetailed(); // per email: leggibile
  const note = document.getElementById('order-note').value;
  const dataOrdine = new Date().toLocaleDateString('it-IT');
  const tot = cart.reduce((s,i)=>s+(i.prezzo*i.qty),0);
  
  const emailBody = `NUOVO ORDINE — Hirostampe Milano\nData: ${dataOrdine}\n\nARTICOLI:\n${csvDetailed}\n\nTOTALE: €${tot.toFixed(2)}\n\nNOTE: ${note||'—'}\n\n--- FILE CSV PER ACTION-WEAR ---\n${csvActionWear}`;

  // Prova EmailJS se configurato
  if(EMAILJS_SERVICE !== 'YOUR_SERVICE_ID') {
    try {
      await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
        to_email: TO_EMAIL,
        subject: `Ordine Milano — ${dataOrdine} — ${cart.length} articoli`,
        message: emailBody,
        csv_content: csvActionWear
      }, EMAILJS_KEY);
      mostraSuccesso();
      return;
    } catch(e) { console.error(e); }
  }

  // Fallback: scarica CSV Action-Wear + apri mailto
  downloadCSV(csvActionWear, dataOrdine);
  const subject = encodeURIComponent(`Ordine Milano — ${dataOrdine}`);
  const body = encodeURIComponent(emailBody.substring(0,1500));
  window.open(`mailto:${TO_EMAIL}?subject=${subject}&body=${body}`);
  mostraSuccesso();
}

function downloadCSV(csv, data) {
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`ordine-milano-${data.replace(/\//g,'-')}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

function mostraSuccesso() {
  document.getElementById('order-main').style.display='none';
  document.getElementById('success-screen').style.display='flex';
}

function nuovoOrdine() {
  cart=[];
  document.getElementById('order-main').style.display='block';
  document.getElementById('success-screen').style.display='none';
  document.getElementById('order-note').value='';
  renderCart();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
